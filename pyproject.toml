[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-serverless"
version = "0.1.0"
description = "A unified SDK for deploying and interacting with serverless functions across multiple providers"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Unified Serverless Contributors", email = "hello@unified-serverless.dev"}
]
maintainers = [
    {name = "Unified Serverless Contributors", email = "hello@unified-serverless.dev"}
]
keywords = ["serverless", "cloud", "deployment", "cloudflare", "workers", "lambda", "functions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "httpx>=0.24.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.0.280",
]

[project.scripts]
unified = "unified_serverless.cli.main:app"

[project.urls]
Homepage = "https://github.com/yourusername/unified-serverless"
Documentation = "https://github.com/yourusername/unified-serverless#readme"
Repository = "https://github.com/yourusername/unified-serverless"
Issues = "https://github.com/yourusername/unified-serverless/issues"

[tool.hatch.build.targets.wheel]
packages = ["unified_serverless"]

[tool.hatch.build.targets.sdist]
include = [
    "/unified_serverless",
    "/tests",
    "/examples",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["unified_serverless"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.6",
]
